name: travelpayouts-mcp
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      TRAVELPAYOUTS_TOKEN:
        type: string
        description: API token from travelpayouts.com
    required: [TRAVELPAYOUTS_TOKEN]
  commandFunction: |
    (config) => ({
      command: "npx",
      args: ["-y", "@theyahia/travelpayouts-mcp"],
      env: {
        TRAVELPAYOUTS_TOKEN: config.TRAVELPAYOUTS_TOKEN,
      },
    })
